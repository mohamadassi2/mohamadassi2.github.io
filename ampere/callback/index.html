<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ampere sign-in</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #09090c; color: #f2f2f7;
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  main { text-align: center; padding: 24px; max-width: 420px; }
  a { color: #4ab0ff; }
</style>
</head>
<body>
<main>
  <h1>⚡ Returning to Ampere…</h1>
  <p id="msg">If nothing happens, <a id="link" href="#">tap here</a>.</p>
</main>
<script>
  // Tesla requires an HTTPS redirect URI. This page hands the authorization code to the app.
  var target = "ampere://oauth" + window.location.search;
  document.getElementById("link").href = target;
  window.location.replace(target);
</script>
</body>
</html>
